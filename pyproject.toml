[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robo-harness-k1"
version = "0.1.0"
description = "robo-harness k1: tool-augmented visual robot control"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<2", "scipy>=1.11,<1.16", "httpx>=0.27,<1",
  "opencv-python-headless>=4.8,<4.12", "Pillow>=10", "PyYAML>=6",
]

[project.urls]
Repository = "https://github.com/Robo-Harness/k1"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.12", "build>=1"]
grasp = ["pyzmq>=25", "msgpack>=1", "msgpack-numpy>=0.4"]
training = ["torch>=2.6", "transformers>=5.2,<6", "peft>=0.18", "accelerate>=1", "jsonschema>=4"]

[project.scripts]
robo-harness = "robo_harness.cli:main"
robo-harness-prepare = "robo_harness.training.prepare:main"
robo-harness-train = "robo_harness.training.sft:main"
robo-harness-audit = "robo_harness.release_audit:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
